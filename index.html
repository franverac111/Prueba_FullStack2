<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TiendaDeCartas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="estilos/style.css">
</head>
<body>
    <header id="header">
    </header>
    
    <main>
        <section class="seccion-carrusel">
            <h2>Productos Destacados</h2>

            <div class="carrusel-marco">
                <div id="carrusel-pista" class="carrusel-pista"></div>
            </div>

            <div class="carrusel-controles">
                <button id="btn-prev" onclick="moverCarrusel(-1)">&lang; Anterior</button>
                <button id="btn-next" onclick="moverCarrusel(1)">Siguiente &rang;</button>
            </div>
        </section>
    </main>

    <footer id="footer">
    </footer>
    <script src="scripts/productos.js"></script>
    <script src="scripts/script.js"></script>
</body>

</html>
