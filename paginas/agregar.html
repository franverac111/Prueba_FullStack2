<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../estilos/style.css">
</head>
<body>
    <header id="header"></header>
    

<form id="form-producto" class="admin-form">
  <h2>Gestión de Cartas TCG</h2>
  
  <input type="hidden" id="producto-id" />

  <label for="nombre">Nombre de la Carta:</label>
  <input type="text" id="nombre" name="nombre" required placeholder="Ej. El Gran Zeus">
  <span class="error-msg" id="error-nombre"></span>

  
  <label for="tipo">Categoría:</label>
  <select id="tipo" name="tipo" required>
    <option value="aliado">Aliado</option>
    <option value="oro">Oro</option>
    <option value="talisman">Talisman</option>
    <option value="totem">Totem</option>
    <option value="arma">Arma</option>
  </select>
  <span class="error-msg" id="error-categoría"></span>

  <label for="rareza">Rareza:</label>
  <select id="rareza" name="rareza" required>
    <option value="vasallo">Vasallo</option>
    <option value="cortesano">Cortesano</option>
    <option value="real">Real</option>
    <option value="megareal">Mega Real</option>
    <option value="ultrareal">Ultra Real</option>
    <option value="legendaria">Legendaría</option>
    <option value="secreta">Secreta</option>
    <option value="promocionales">Promocionales</option>
  </select>
  <span class="error-msg" id="error-categoría"></span>

  <label for="precio">Precio ($):</label>
  <input type="number" id="precio" name="precio" min="1" step="0.01" required placeholder="Ej. 25.00">
  <span class="error-msg" id="error-precio"></span>

  <label for="imagen">URL de la Imagen:</label>
  <input type="url" id="imagen" name="imagen" placeholder="https://ejemplo.com/carta.png" required>
  <span class="error-msg" id="error-imagen"></span>

  <button type="submit" id="btn-guardar">Guardar Carta</button>
</form>

<section class="tabla-contenedor">
  <h3>Inventario de Cartas</h3>
  <table id="tabla-productos">
    <thead>
      <tr>
        <th>Imagen</th>
        <th>Carta</th>
        <th>Juego</th>
        <th>Precio</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody id="lista-productos"></tbody>
  </table>
</section>
</body>
<footer id="footer"></footer>
<script src="../scripts/script.js"></script>
</html>
