<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión | El Caldero de la Abundancia</title>
    <link rel="stylesheet" href="../estilos/style.css">
</head>

<body>

    <header id="header"></header>

    <main>
        <section class="login-container">

            <div class="login-brand">

                <img
                    src="https://static.wikia.nocookie.net/myl-tcg/images/f/f4/Myl-logo1-sf.png/revision/latest?cb=20240717144516&path-prefix=es"
                    alt="Logo de Mitos y Leyendas"
                >

                <h1>Iniciar sesión</h1>

            </div>

            <form id="loginForm">

                <div class="login-field">

                    <label for="email">Correo electrónico</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Ingresa tu correo"
                    >

                    <span id="emailError" class="login-error"></span>

                </div>

                <div class="login-field">

                    <label for="password">Contraseña</label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Ingresa tu contraseña"
                    >

                    <span id="passwordError" class="login-error"></span>

                </div>

                <button type="submit" class="login-button">
                    Iniciar sesión
                </button>

                <p id="loginMessage" class="login-message"></p>

            </form>

            <div class="login-links">

                <a href="recuperar.html">
                    ¿Olvidaste tu contraseña?
                </a>

                <p>
                    ¿No tienes una cuenta?
                    <a href="registro.html">Regístrate</a>
                </p>

            </div>

        </section>
    </main>

    <footer id="footer"></footer>

    <script src="../scripts/script.js"></script>

</body>

</html>
