<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tienda</title>
    <link rel="stylesheet" href="../estilos/style.css">
</head>
<body>
   <header id="header"></header>

   <main>
       <h1>Productos de la tienda</h1>
       <section id="productos">
            <div class="producto">
                <img src="https://cartasmitos.cl/wp-content/uploads/2021/08/96-4.jpg" alt="carta escila">
                <h2>Escila</h2>
                <p>$50000</p>
                <button>agregar</button>
            </div>
            <div class="producto">
                <img src="https://cartasmitos.cl/wp-content/uploads/2021/07/9-7.jpg" alt="carta El gran zeus">
                <h2>El gran zeus</h2>
                <p>$20000</p>
                <button>agregar</button>
            </div>
            <div class="producto">
                <img src="https://cartasmitos.cl/wp-content/uploads/2021/07/9-7.jpg" alt="carta Mascara de oro">
                <h2>Mascara de oro</h2>
                <p>$30000</p>
                <button>agregar</button>
            </div>
            <div class="producto">
                <img src="https://cartasmitos.cl/wp-content/uploads/2021/06/31-8-600x600.jpg" alt="carta Atlas">
                <h2>Atlas</h2>
                <p>$10000</p>
                <button>agregar</button>
            </div>
            <div class="producto">
                <img src="https://http2.mlstatic.com/D_NQ_NP_622279-MLC96178730851_102025-O.webp" alt="carta Amon-ra">
                <h2>Amon-ra</h2>
                <p>$5000</p>
                <button>agregar</button>
            </div>
            <div class="producto">
                <img src="https://http2.mlstatic.com/D_NQ_NP_989097-MLC95736622666_102025-O.webp" alt="carta monru">
                <h2>Monru</h2>
                <p>$15000</p>
                <button>agregar</button>
            </div>
            <div class="producto">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSNrWF1mP10PNhKaG9u8PPpXa3eWZpvfWSaWFy_Y23hM_iAcVn4wtq3PI6I&s=10" alt="carta Cuz templaria">
                <h2>Cruz templaria</h2>
                <p>$25000</p>
                <button>agregar</button>
            </div>
        

   </main>

   <footer id="footer"></footer>
   <script src="../scripts/script.js"></script>
</body>
</html>
